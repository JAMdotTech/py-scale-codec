name: Test and deploy to PYPI

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Install project dependencies
      run: |
        python -m pip install --upgrade 'pip>=26.3'
        python -m pip install 'base58>=2.0.1' more-itertools 'requests>=2.34.2' \
          'certifi>=2026.10.19' 'idna>=3.15' 'urllib3>=2.8.0' 'pytest>=9.1' 'flake8>=7.4'
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: python -m pytest
    - name: Install deploy dependencies
      run: |
        python -m pip install 'setuptools>=84.1.0' twine
    - name: Build and publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        python setup.py sdist bdist_wheel
        twine upload dist/*
